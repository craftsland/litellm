# Ephemeral per-SHA e2e stack values for helm/litellm-helm (PoC step 2).
# Generated by build_merged_values.py from litellm-ops
# apps/overlays/berrie-litellm-stage/litellm-patch.yaml — the proxy_config
# below is that overlay's gateway.config.proxy_config merged in as parsed
# YAML (never --set-file), with ONE deliberate change: litellm_settings.
# cache_params points at the bundled per-release redis (chart injects
# REDIS_HOST/PORT/PASSWORD envs) instead of the shared stage ElastiCache,
# so the ephemeral stack never writes to shared infra.
# Deltas vs the first draft of this file:
#   - envSecrets -> environmentSecrets (envSecrets is the componentized
#     chart's key; this chart ignores it, so provider keys were never
#     injected)
#   - redis.auth.enabled: true (the chart unconditionally mounts
#     <release>-redis/redis-password when redis.enabled; with auth off
#     bitnami creates no secret and every proxy pod dies with
#     CreateContainerConfigError)
#   - environmentConfigMaps: litellm-env (OTEL endpoint, STORE_MODEL_IN_DB,
#     PROMETHEUS_MULTIPROC_DIR — mirrors the stage gateway's env)
#   - args + envVars.CONFIG_FILE_PATH: the internal litellm/gateway image's
#     entrypoint is `uvicorn gateway.main:app` (gateway/Dockerfile:100) and
#     reads its config from CONFIG_FILE_PATH, unlike the OSS image this
#     chart targets, whose CLI accepts the chart's default
#     `--config /etc/litellm/config.yaml` args. Those defaults crash uvicorn
#     ("No such option: --config"), so restore the image's own CMD and point
#     CONFIG_FILE_PATH at the chart's config mount.
#   - prometheus-multiproc emptyDir at /tmp/litellm_prometheus_multiproc:
#     litellm-env sets PROMETHEUS_MULTIPROC_DIR to that path and
#     prometheus_client refuses to start unless the directory exists
#     (ValueError at app startup); the componentized chart mounts an
#     emptyDir there for the live gateway, so mirror it.
replicaCount: 2
image:
  repository: 654278500801.dkr.ecr.us-east-1.amazonaws.com/litellm/gateway
  pullPolicy: IfNotPresent
db:
  useExisting: false
  deployStandalone: true
redis:
  enabled: true
  architecture: standalone
  coordination:
    enabled: true
  auth:
    enabled: true
migrationJob:
  enabled: true
  disableSchemaUpdate: false
masterkeySecretName: litellm-master-key
masterkeySecretKey: master-key
environmentSecrets:
- litellm-license
- litellm-provider-keys
environmentConfigMaps:
- litellm-env
args:
- --host
- 0.0.0.0
- --port
- '4000'
envVars:
  CONFIG_FILE_PATH: /etc/litellm/config.yaml
volumes:
- name: prometheus-multiproc
  emptyDir:
    sizeLimit: 500Mi
volumeMounts:
- name: prometheus-multiproc
  mountPath: /tmp/litellm_prometheus_multiproc
nodeSelector:
  karpenter.sh/nodepool: litellm-worker-t3
tolerations:
- key: workload
  operator: Equal
  value: litellm
  effect: NoSchedule
ingress:
  enabled: false
proxy_config:
  general_settings:
    store_prompts_in_spend_logs: true
    forward_client_headers_to_llm_api: false
    maximum_spend_logs_retention_period: 3h
    maximum_spend_logs_cleanup_cron: 0 1 * * *
    proxy_config_reload_interval_seconds: 10
    proxy_budget_rescheduler_min_time: 15
    proxy_budget_rescheduler_max_time: 20
  litellm_settings:
    drop_params: true
    default_redis_ttl: 20
    json_logs: true
    store_audit_logs: true
    cache: true
    cache_params:
      type: redis
    callbacks:
    - datadog
    - prometheus
    - otel
    require_auth_for_metrics_endpoint: false
  router_settings:
    fallbacks:
    - gpt-5.5:
      - gpt-5.6-luna
      - gpt-5.2
    - claude-haiku-4-5:
      - gemini-2.5-flash
      - gpt-5.6-luna
    routing_strategy: simple-shuffle
    num_retries: 3
  model_list:
  - model_name: gpt-5.5
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-5.6-luna
    litellm_params:
      model: openai/gpt-5.6-luna
      api_key: os.environ/OPENAI_API_KEY
  - model_name: gpt-5.2
    litellm_params:
      model: openai/gpt-5.2
      api_key: os.environ/OPENAI_API_KEY
  - model_name: claude-haiku-4-5
    litellm_params:
      model: anthropic/claude-haiku-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: azure-foundry-claude-haiku
    litellm_params:
      model: azure_ai/claude-haiku-4-5
      api_base: os.environ/AZURE_AI_API_BASE
      api_key: os.environ/AZURE_AI_API_KEY
  - model_name: gemini-2.5-flash-vertex
    litellm_params:
      model: vertex_ai/gemini-2.5-flash
      vertex_project: os.environ/VERTEXAI_PROJECT
      vertex_location: us-central1
      vertex_credentials: os.environ/VERTEXAI_CREDENTIALS
  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
  mcp_servers:
    devin:
      url: https://mcp.devin.ai/mcp
      auth_type: api_key
      auth_value: os.environ/DEVIN_API_KEY
