steps:
  - label: ":kubernetes: smoke — in-cluster agent"
    key: eks-smoke
    agents:
      queue: "eks-stage"
    plugins:
      - kubernetes:
          podSpec:
            containers:
              - image: curlimages/curl:8.11.1
                command:
                  - |
                    set -e
                    echo "--- where am I"
                    echo "pod:       $${HOSTNAME}"
                    echo "namespace: $$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace 2>/dev/null || echo '?')"
                    echo "--- can I reach the proxy under test"
                    curl -fsS -m 10 http://litellm-gateway.litellm.svc.cluster.local:4000/health/liveliness && echo " <- reachable"
                    echo "--- can I read the e2e secrets (presence only, never the value)"
                    [ -n "$${LITELLM_MASTER_KEY}" ] && echo "LITELLM_MASTER_KEY: present" || { echo "LITELLM_MASTER_KEY: MISSING"; exit 1; }
                    [ -n "$${DD_API_KEY}" ] && echo "DD_API_KEY: present" || { echo "DD_API_KEY: MISSING"; exit 1; }
                env:
                  - name: LITELLM_MASTER_KEY
                    valueFrom:
                      secretKeyRef:
                        name: litellm-master-key
                        key: master-key
                  - name: DD_API_KEY
                    valueFrom:
                      secretKeyRef:
                        name: litellm-provider-keys
                        key: DD_API_KEY

  - input: ":mag: release candidate"
    key: candidate
    fields:
      - text: "litellm commit SHA"
        key: litellm_sha
        hint: "Full 40-char SHA on litellm_internal_staging"

  - wait: ~

  - label: ":octocat: gate — GHA required checks"
    key: gate-gha
    depends_on: candidate
    agents:
      queue: "linux-small"
    # meta-data is read on the agent, NOT inside the container: the docker
    # plugin's image has no buildkite-agent binary, so reading it in-container
    # exits 127. Resolve it here and pass the value in as an env var.
    command: |
      export LITELLM_SHA="$(buildkite-agent meta-data get litellm_sha)"
      docker run --rm -v "$$PWD:/w" -w /w -e GITHUB_TOKEN -e LITELLM_SHA python:3.12-slim-bookworm ./.buildkite/gate-gha.py "$$LITELLM_SHA"

  - group: ":test_tube: unit tests"
    key: unit
    steps:
      - label: ":react: ui — utils"
        key: ui-utils
        command: .buildkite/run-ui.sh src/utils
        agents:
          queue: "linux-medium"
        artifact_paths:
          - "ui/litellm-dashboard/junit-ui.xml"
        retry:
          automatic:
            - exit_status: -1
              limit: 2
        plugins:
          - docker#v5.11.0:
              image: "node:20-bookworm-slim"
              propagate-environment: true

      - label: ":python: backend — types"
        key: backend-types
        command: .buildkite/run-unit.sh tests/test_litellm/types 2
        agents:
          queue: "linux-medium"
        artifact_paths:
          - "junit-*.xml"
        retry:
          automatic:
            - exit_status: -1
              limit: 2
        plugins:
          - docker#v5.11.0:
              image: "python:3.12-bookworm"
              propagate-environment: true

      - label: ":python: backend — router utils"
        key: backend-router-utils
        command: .buildkite/run-unit.sh tests/test_litellm/router_utils 2
        agents:
          queue: "linux-medium"
        artifact_paths:
          - "junit-*.xml"
        retry:
          automatic:
            - exit_status: -1
              limit: 2
        plugins:
          - docker#v5.11.0:
              image: "python:3.12-bookworm"
              propagate-environment: true

  - wait: ~

  # PoC step 2: ephemeral per-SHA proxy stack (proxy + bundled Postgres +
  # bundled Redis) helm-installed into the litellm namespace. Runs the
  # gateway image tagged e2e-<litellm_sha>; the image step from PoC step 1
  # should be added to depends_on once it exists. depends_on: candidate
  # (not the waits) so a red gate-gha can't block the PoC path — mirrors
  # e2e-run. Release name carries the build number, and every rendered
  # resource gets app.kubernetes.io/instance=<release>, never `litellm`,
  # so ArgoCD ignores it and the litellm-gateway release is untouched.
  # Auth: the pod's `default` ServiceAccount, bound to ClusterRole `edit`
  # in this namespace only (RoleBinding e2e-poc-buildkite-jobs-edit —
  # accepted-insecure PoC shortcut). Teardown is manual until PoC step 3:
  #   helm uninstall <release> -n litellm
  #   kubectl delete pvc -l app.kubernetes.io/instance=<release> -n litellm
  - label: ":helm: deploy — ephemeral per-SHA stack"
    key: deploy-ephemeral
    depends_on: candidate
    agents:
      queue: "eks-stage"
    timeout_in_minutes: 30
    plugins:
      - kubernetes:
          podSpec:
            containers:
              - image: alpine/k8s:1.35.6
                # ONE list element: the k8s plugin joins `command` into a
                # single shell string instead of exec'ing argv.
                command:
                  - |
                    set -eu
                    LITELLM_SHA="$$(buildkite-agent meta-data get litellm_sha)"
                    RELEASE="e2e-bk-$${BUILDKITE_BUILD_NUMBER}"
                    echo "--- :helm: helm upgrade --install $${RELEASE} (image tag e2e-$${LITELLM_SHA})"
                    helm upgrade --install "$${RELEASE}" ./helm/litellm-helm \
                      --namespace litellm \
                      --values .buildkite/e2e-ephemeral-values.yaml \
                      --set-string image.repository=654278500801.dkr.ecr.us-east-1.amazonaws.com/litellm/gateway \
                      --set-string "image.tag=e2e-$${LITELLM_SHA}"
                    echo "--- :hourglass: wait for prisma migrations (fresh DB, several minutes)"
                    sleep 10
                    kubectl wait --for=condition=complete "job/$${RELEASE}-litellm-migrations" -n litellm --timeout=600s
                    echo "--- :kubernetes: wait for proxy rollout"
                    kubectl rollout status "deploy/$${RELEASE}-litellm" -n litellm --timeout=600s
                    kubectl get pods -n litellm -l "app.kubernetes.io/instance=$${RELEASE}"
                    echo "--- :stethoscope: liveliness"
                    i=1
                    while [ "$$i" -le 60 ]; do
                      code="$$(curl -s -o /dev/null -w '%{http_code}' -m 5 "http://$${RELEASE}-litellm.litellm.svc.cluster.local:4000/health/liveliness" || true)"
                      echo "attempt $${i}: HTTP $${code}"
                      if [ "$${code}" = "200" ]; then
                        echo "ephemeral stack $${RELEASE} is live"
                        exit 0
                      fi
                      i=$$((i+1))
                      sleep 10
                    done
                    echo "liveliness never returned 200"
                    exit 1

  - label: ":microscope: e2e — full suite"
    key: e2e-run
    depends_on: candidate
    agents:
      queue: "eks-stage"
    timeout_in_minutes: 180
    plugins:
      - kubernetes:
          podSpec:
            nodeSelector:
              karpenter.sh/nodepool: litellm-worker-t3
            # That nodepool is tainted workload=litellm:NoSchedule, so without
            # this the pod sits Pending until the controller's 15m timeout
            # kills it. Mirrors the toleration on the ArgoCD-managed Job.
            tolerations:
              - key: workload
                operator: Equal
                value: litellm
                effect: NoSchedule
            containers:
              - image: 654278500801.dkr.ecr.us-east-1.amazonaws.com/litellm-e2e:1.0.0-main.20260803162759
                command: ["/app/entrypoint.sh"]
                args: ["-v"]
                env:
                - name: LITELLM_PROXY_URL
                  value: http://internal-k8s-litellm-litellm-e7f4afb143-1355079179.us-east-1.elb.amazonaws.com
                - name: LITELLM_MASTER_KEY
                  valueFrom:
                    secretKeyRef:
                      key: master-key
                      name: litellm-master-key
                - name: REQUIRE_PROXY
                  value: '1'
                - name: TEST_MODE
                  value: full
                - name: DRY_RUN_TEST_COUNT
                  value: '3'
                - name: E2E_POLL_TIMEOUT
                  value: '120'
                - name: E2E_POLL_INTERVAL
                  value: '5'
                - name: E2E_REQUEST_TIMEOUT
                  value: '60'
                - name: E2E_LOAD_DURATION_SECONDS
                  value: '180'
                - name: REDIS_HOST
                  value: berrie-litellm-stage-ieib2i.serverless.use1.cache.amazonaws.com
                - name: REDIS_PORT
                  value: '6379'
                - name: E2E_LOAD_USERS
                  value: '100'
                - name: E2E_LOAD_SPAWN_RATE
                  value: '25'
                - name: E2E_LOAD_MIN_RPS
                  value: '50'
                - name: E2E_OTEL_QUERY_URL
                  value: http://jaeger.monitoring.svc.cluster.local:16686
                - name: E2E_UI_ARTIFACT_DIR
                  value: /tmp/playwright-artifacts
                - name: PRESIDIO_ANALYZER_API_BASE
                  valueFrom:
                    secretKeyRef:
                      key: PRESIDIO_ANALYZER_API_BASE
                      name: litellm-provider-keys
                - name: PRESIDIO_ANONYMIZER_API_BASE
                  valueFrom:
                    secretKeyRef:
                      key: PRESIDIO_ANONYMIZER_API_BASE
                      name: litellm-provider-keys
                - name: LANGFUSE_PUBLIC_KEY
                  valueFrom:
                    secretKeyRef:
                      key: LANGFUSE_PUBLIC_KEY
                      name: litellm-provider-keys
                - name: LANGFUSE_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      key: LANGFUSE_SECRET_KEY
                      name: litellm-provider-keys
                - name: LANGFUSE_BASE_URL
                  valueFrom:
                    secretKeyRef:
                      key: LANGFUSE_BASE_URL
                      name: litellm-provider-keys
                - name: DD_API_KEY
                  valueFrom:
                    secretKeyRef:
                      key: DD_API_KEY
                      name: litellm-provider-keys
                - name: DD_APP_KEY
                  valueFrom:
                    secretKeyRef:
                      key: DD_APP_KEY
                      name: litellm-provider-keys
                - name: DD_SITE
                  valueFrom:
                    secretKeyRef:
                      key: DD_SITE
                      name: litellm-provider-keys
                - name: ANTHROPIC_API_KEY
                  valueFrom:
                    secretKeyRef:
                      key: ANTHROPIC_API_KEY
                      name: litellm-provider-keys
                - name: COHERE_API_KEY
                  valueFrom:
                    secretKeyRef:
                      key: COHERE_API_KEY
                      name: litellm-provider-keys
                - name: AWS_ROLE_NAME
                  valueFrom:
                    secretKeyRef:
                      key: AWS_ROLE_NAME
                      name: litellm-provider-keys
                - name: BEDROCK_GUARDRAIL_IDENTIFIER
                  valueFrom:
                    secretKeyRef:
                      key: BEDROCK_GUARDRAIL_IDENTIFIER
                      name: litellm-provider-keys
                - name: BEDROCK_GUARDRAIL_VERSION
                  valueFrom:
                    secretKeyRef:
                      key: BEDROCK_GUARDRAIL_VERSION
                      name: litellm-provider-keys
                - name: BUILDKITE_ANALYTICS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      key: BUILDKITE_ANALYTICS_TOKEN
                      name: litellm-provider-keys

  - wait: ~

  - block: ":hand: manual QA"
    key: qa-gate
    prompt: "Release candidate QA'd against this exact build?"
    fields:
      - select: "Verdict"
        key: qa-verdict
        options:
          - label: "Pass — promote"
            value: "pass"
          - label: "Fail — hold"
            value: "fail"
      - text: "Notes"
        key: qa-notes
        required: false

  - label: ":lock: sign + publish"
    key: publish
    depends_on: qa-gate
    agents:
      queue: "linux-small"
    command: |
      echo "--- placeholder for project-releaser"
      echo "would promote the digest built from ${BUILDKITE_COMMIT}"
      echo "nothing is published by this PoC"
